apiVersion: v1
kind: ServiceAccount
metadata: {name: planeon-ai-gateway, namespace: {{ .Values.global.namespace | quote }}, labels: {planeon.ai/module: ai-gateway}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: planeon-ai-gateway-reader, namespace: {{ .Values.global.namespace | quote }}}
rules: [{apiGroups: [""], resources: ["configmaps"], verbs: ["get", "list", "watch"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: planeon-ai-gateway-reader, namespace: {{ .Values.global.namespace | quote }}}
subjects: [{kind: ServiceAccount, name: planeon-ai-gateway, namespace: {{ .Values.global.namespace | quote }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: planeon-ai-gateway-reader}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: planeon-ai-gateway, namespace: {{ .Values.global.namespace | quote }}, labels: {planeon.ai/module: ai-gateway}}
spec:
  replicas: 1
  selector: {matchLabels: {planeon.ai/module: ai-gateway}}
  template:
    metadata: {labels: {planeon.ai/module: ai-gateway}}
    spec:
      serviceAccountName: planeon-ai-gateway
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: {{ .Values.global.architecture | quote }}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ai-gateway
          image: {{ .Values.global.images.aiGateway | quote }}
          imagePullPolicy: IfNotPresent
          args: ["serve", "--offline"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: {{ .Values.global.resources.aiGateway.requestCpu | quote }}, memory: {{ .Values.global.resources.aiGateway.requestMemory | quote }}}
            limits: {cpu: {{ .Values.global.resources.aiGateway.limitCpu | quote }}, memory: {{ .Values.global.resources.aiGateway.limitMemory | quote }}}
