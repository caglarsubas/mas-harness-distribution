apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planeon-default-deny
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/part-of: planeon-harness-platform
    planeon.ai/profile: {{ .Values.global.profileId | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
